name: ETL Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run ETL process
        run: python etl_process.py

      - name: Show ETL log
        run: cat data/output/etl_execution.log
